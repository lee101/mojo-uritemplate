[project]
name = "mojo-uritemplate"
version = "0.1.0"
description = "RFC 6570 URI Template expansion implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "uri", "url", "rfc6570", "uritemplate"]

[project.optional-dependencies]
dev = ["pytest", "uritemplate"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-uritemplate"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
